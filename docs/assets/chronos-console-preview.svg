<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="ChronosSched Flight-Recorder Console and TUI Time-Travel Scrubber Preview">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="100%" stop-color="#11182b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
      .title { fill: #f1f5f9; font-size: 13px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10.5px; font-weight: 500; }
      .card-title { fill: #cbd5e1; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .th { fill: #64748b; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; }
      .td { fill: #e2e8f0; font-size: 11px; }
      .td-muted { fill: #94a3b8; font-size: 10.5px; }
      .badge-text { font-size: 9.5px; font-weight: 700; }
      .btn-text { font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <!-- Outer Frame -->
